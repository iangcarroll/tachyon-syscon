name: Local reconstruction checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_proofs:
        description: Run optional checksum proof tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install local emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang z3 xz-utils
          python -m pip install -r requirements.txt
      - name: Install the pinned Arm GNU compiler
        # Arm's official 13.3.rel1 release and published SHA-256:
        # https://gitlab.arm.com/tooling/gnu-toolchains-for-arm/-/tree/releases/13.3.rel1
        run: |
          cd "$RUNNER_TEMP"
          toolchain_archive=arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 --max-time 300 "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/13.3.rel1/$toolchain_archive" -o "$toolchain_archive"
          printf '%s  %s\n' '95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4' "$toolchain_archive" | sha256sum --check -
          mkdir -p arm-gnu
          tar -xJf "$toolchain_archive" --strip-components=1 -C arm-gnu
          echo "$RUNNER_TEMP/arm-gnu/bin" >> "$GITHUB_PATH"
      - name: Fetch and verify pinned test inputs
        run: |
          python tools/fetch_references.py
          python tools/fetch_firmware.py --with-updater
      - name: Run differential and complete-image emulation tests
        env:
          SYSCON_COVERAGE_OUTPUT: build/ci/test-checkpoint.json
          SYSCON_FETCH_NETWORK: '1'
          SYSCON_SCENARIO_OUTPUT: build/ci/scenarios
        run: python -m pytest -q tests --junitxml=build/ci/functional-tests.xml
      - name: Audit the packaged updater offline
        env:
          SYSCON_UPDATER_BINARY: build/reference-tools/mspm0flash
          PYTHONPATH: tools
        run: |
          python tools/audit_packaged_updater.py --binary "$SYSCON_UPDATER_BINARY" --output build/ci/updater-audit.json
          python -m pytest -q tools/tests/test_audit_packaged_updater.py --junitxml=build/ci/updater-tests.xml
      - name: Optional scoped proof tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_proofs }}
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tools/tests/test_proof_checksum.py tools/tests/test_proof_physical_checksum.py --junitxml=build/ci/proof-tests.xml
      - name: Build the experimental physical image
        run: python tools/build_physical_firmware.py --output build/ci/physical
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-emulation-evidence
          path: build/ci/
          if-no-files-found: ignore
