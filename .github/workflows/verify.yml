name: Local reconstruction checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_proofs:
        description: Run optional checksum proof tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [core, integration, cold-start, stateful, flash-append, flash-compact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install local emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang z3 xz-utils
          python -m pip install -r requirements.txt
      - name: Install the pinned Arm GNU compiler
        # Arm's official 13.3.rel1 release and published SHA-256:
        # https://gitlab.arm.com/tooling/gnu-toolchains-for-arm/-/tree/releases/13.3.rel1
        run: |
          cd "$RUNNER_TEMP"
          toolchain_archive=arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 --max-time 300 "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/13.3.rel1/$toolchain_archive" -o "$toolchain_archive"
          printf '%s  %s\n' '95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4' "$toolchain_archive" | sha256sum --check -
          mkdir -p arm-gnu
          tar -xJf "$toolchain_archive" --strip-components=1 -C arm-gnu
          echo "$RUNNER_TEMP/arm-gnu/bin" >> "$GITHUB_PATH"
      - name: Fetch and verify pinned test inputs
        run: |
          python tools/fetch_references.py
          python tools/fetch_firmware.py --with-updater
      - name: Run differential and complete-image emulation tests
        env:
          SYSCON_COVERAGE_OUTPUT: build/ci/test-checkpoint.json
          SYSCON_FETCH_NETWORK: '1'
          SYSCON_SCENARIO_OUTPUT: build/ci/scenarios
        # Whole-image regressions are slower than isolated driver comparisons.
        # Disjoint selections cover every default test without a 30-minute core job.
        run: |
          integration=(
            tests/test_firmware_relocation.py
            tests/test_rebuilt_system.py
            tests/test_warm_reset.py
            tests/test_physical_firmware.py
            tests/test_mspm0_end_to_end.py
          )
          if [ "${{ matrix.suite }}" = "cold-start" ]; then
            python -m pytest -q tests/test_functional_scenarios.py --durations=15 --junitxml=build/ci/functional-tests.xml
          elif [ "${{ matrix.suite }}" = "stateful" ]; then
            python -m pytest -q tests/test_stateful_images.py --durations=15 --junitxml=build/ci/functional-tests.xml
          elif [[ "${{ matrix.suite }}" == flash-* ]]; then
            flash_case="${{ matrix.suite }}"
            python -m pytest -q tests/test_flash_interruption_images.py -k "${flash_case#flash-}" --durations=15 --junitxml=build/ci/functional-tests.xml
          elif [ "${{ matrix.suite }}" = "integration" ]; then
            python -m pytest -q "${integration[@]}" --durations=15 --junitxml=build/ci/functional-tests.xml
          else
            ignores=(--ignore=tests/test_functional_scenarios.py --ignore=tests/test_stateful_images.py --ignore=tests/test_flash_interruption_images.py)
            for path in "${integration[@]}"; do ignores+=("--ignore=$path"); done
            python -m pytest -q tests "${ignores[@]}" --durations=15 --junitxml=build/ci/functional-tests.xml
          fi
      - name: Audit the packaged updater offline
        if: ${{ matrix.suite == 'core' }}
        env:
          SYSCON_UPDATER_BINARY: build/reference-tools/mspm0flash
          PYTHONPATH: tools
        run: |
          python tools/audit_packaged_updater.py --binary "$SYSCON_UPDATER_BINARY" --output build/ci/updater-audit.json
          python -m pytest -q tools/tests/test_audit_packaged_updater.py --junitxml=build/ci/updater-tests.xml
      - name: Optional scoped proof tests
        if: ${{ matrix.suite == 'core' && github.event_name == 'workflow_dispatch' && inputs.run_proofs }}
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tools/tests/test_proof_checksum.py tools/tests/test_proof_physical_checksum.py --junitxml=build/ci/proof-tests.xml
      - name: Build the experimental physical image
        if: ${{ matrix.suite == 'core' }}
        run: python tools/build_physical_firmware.py --output build/ci/physical
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-emulation-evidence-${{ matrix.suite }}
          path: build/ci/
          if-no-files-found: ignore
